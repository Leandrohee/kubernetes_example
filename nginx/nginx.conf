user nginx; # Creates a user on linux named nginx rather than using root as a user (default nobody)
worker_processes auto; # Automatically scales to available CPU cores (default 1)
worker_rlimit_nofile 65535; # (default 1024)

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096; # Handles higher concurrent connections
    use epoll; # Optimized I/O event model for Linux
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;


    # ----------------------------------------------------------------------
    # Logging Configuration
    # ----------------------------------------------------------------------
    log_format debug_format 'LOG_DEBUG: '
            'remote=$remote_addr | '
            'realip_remote_addr=$realip_remote_addr | '
            'xff=$http_x_forwarded_for | '
            'proxy_xff=$proxy_add_x_forwarded_for | '
            'method=$request_method | '
            'uri=$uri | '
            'args=$args | '
            'request_uri=$request_uri | '
            'status=$status | '
            'upstream_addr=$upstream_addr | '
            'up_status=$upstream_status | '
            'up_response_length=$upstream_response_length | '
            'host=$host | '
            'http_host=$http_host | '
            'server_name=$server_name | '
            'scheme=$scheme | '
            'request=$request | '
            'proxy_host=$proxy_host | '
            'upstream_http_location=$upstream_http_location | '
            'sent_http_location=$sent_http_location | '
            'rt=$request_time | '
            'urt=$upstream_response_time | '
            'body_bytes_sent=$body_bytes_sent | '
            'http_referer=$http_referer | '
            'http_user_agent=$http_user_agent';

    # ----------------------------------------------------------------------
    # Performance Tuning
    # ----------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Hides NGINX version in headers for security

    # ----------------------------------------------------------------------
    # Gzip Compression
    # ----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ----------------------------------------------------------------------
    # Modern TLS Security (Mozilla Intermediate Profile)
    # ----------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Session resumption for faster HTTPS handshakes
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m; # ~40,000 sessions
    ssl_session_tickets off;

    # ----------------------------------------------------------------------
    # Internal DNS for nginx - required for dynamic ips (only on docker network)
    # Is not required for Kubernetes
    # ----------------------------------------------------------------------
    # resolver 127.0.0.11 valid=30s; # Docker DNS
    # resolver 10.96.0.10 valid=30s; # K8s DNS


    # ----------------------------------------------------------------------
    # HTTP Server -> Redirect All to HTTPS
    # ----------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name localhost www.localhost;

        # Lightweight health check endpoint over HTTP (for load balancers/Kubernetes probes)
        location /healthz {
            access_log on;
            add_header Content-Type text/plain;
            return 200 'healthy\n';
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------------------------------------------------
    # HTTPS Server
    # ----------------------------------------------------------------------
    server {
        access_log /var/log/nginx/access.log debug_format;
        access_log /dev/stdout debug_format;

        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name localhost www.localhost;

        # SSL Certificates
        ssl_certificate /etc/nginx/ssl/custom_certs.crt;
        ssl_certificate_key /etc/nginx/ssl/custom_certs.key;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Health Check Endpoint over HTTPS
        location /healthz {
            access_log on;
            add_header Content-Type text/plain;
            return 200 'healthy\n';
        }


        # Without the dinamic Ip (FRONTEND)
        location / {
            proxy_pass http://frontend-service:4000;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }


        # Without the dinamic Ip (Backend)
        location /backend/ {
            proxy_pass http://backend-service:3333/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # With dinamic ip (FRONTEND) - Not required When kubernetes services is on
        # location / {
        #     set $fe_dinamic_ip frontend-service:4000;

        #     proxy_pass http://$fe_dinamic_ip$request_uri;
        #     proxy_http_version 1.1;

        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header Connection "";

        #     proxy_connect_timeout 60s;
        #     proxy_send_timeout 60s;
        #     proxy_read_timeout 60s;
        # }


        # With dinamic ip (Backend) - Not required When kubernetes services is on
        # location /backend/ {
        #     set $be_dinamic_ip backend_k8s_service:3333;
        #     rewrite ^/backend/(.*) /$1 break;

        #     proxy_pass http://$be_dinamic_ip;
        #     proxy_http_version 1.1;

        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header Connection "";

        #     proxy_connect_timeout 60s;
        #     proxy_send_timeout 60s;
        #     proxy_read_timeout 60s;
        # }
    }

}

