apiVersion: v1
kind: Service
metadata:
  namespace: kubernetes-example-local
  name: frontend-service

spec:
  type: ClusterIP

  selector:
    app: frontend-label

  ports:
  - name: next
    port: 4000
    targetPort: 4000



# This is a kubernetes service resource
# 

# Internet
#     │
#     ▼
# NodePort 30080
#     │
#     ▼
# nginx-service (NodePort - external)
#     │
#     ▼
# Nginx Pod
#     │
#     ▼
# frontend-service (ClusterIp - internal)
#     │
#     ▼
# Frontend Pod