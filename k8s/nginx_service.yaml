apiVersion: v1
kind: Service
metadata:
  name: nginx-service

spec:
  type: NodePort

  selector:
    app: nginx-label

  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080


# This is a kubernetes service resource
#[ External Client ]
#            │
#            │ Hits Node IP on nodePort
#            ▼
#┌───────────────────────────────┐
#│  Node IP : 30080  (nodePort)  │  <-- Exposed on all Cluster Worker Nodes
#└───────────┬───────────────────┘
#            │
#            │ Forwards traffic to Service IP
#            ▼
#┌───────────────────────────────┐
#│  Service IP : 80     (port)   │  <-- Cluster-internal Virtual IP
#└───────────┬───────────────────┘
#            │
#            │ Routes to Pods matching selector (app=nginx)
#            ▼
#┌───────────────────────────────┐
#│  Pod / Container : 80         │
#│         (targetPort)          │  <-- Actual process listening inside container