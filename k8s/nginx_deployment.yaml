apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-label
  template:
    metadata:
      labels:
        app: nginx-label
    spec:
      containers:
      - name: nginx-container
        image: nginx_k8s_image:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80

# Deployment is an workerload type stateless
# This deploy a pod in my node 
# It open the port 80 on the container, but I need the service to be acessible to the outside world